# Experiment settings. Restart the backend after you change this file.
#
# participants: order = Player A, B, C. Pick one of the 3 conditions:
#   1) 3 humans:         [human, human, human]
#   2) 2 humans + 1 AI: [human, human, ai]
#   3) 1 human + 2 AI:  [human, ai, ai]
participants: [human, ai, ai]

rounds: 2
chat_seconds: 30       # length of the chat in each round
vote_seconds: 15       # time to vote (ends early if everyone voted)
feedback_seconds: 8    # how long the round tally is shown (between rounds)
min_wait_seconds: 3    # waiting room lasts at least this long (keeps conditions look the same)

ai:
  model: "gemini-3.1-flash-lite"   # Gemini model name (the one my eo-agent project uses). Needs GEMINI_API_KEY.
  reply_delay_seconds: [4, 10]     # an AI player waits a random time in this range before each message
  max_messages_per_round: 3        # an AI player writes at most this many messages per round
